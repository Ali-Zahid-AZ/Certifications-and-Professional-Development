name: Import Obsidian config

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-obsidian-config.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4

      - name: Clone source vault
        run: git clone --depth 1 https://github.com/Ali-Zahid-AZ/obsidian-personal.git /tmp/obsidian-personal

      - name: Copy Obsidian configuration without Obsidian Git
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Obsidian-Config
          mkdir -p Obsidian-Config/.obsidian
          rsync -a --exclude='plugins/obsidian-git/' /tmp/obsidian-personal/.obsidian/ Obsidian-Config/.obsidian/
          python -c "import json,pathlib; p=pathlib.Path('Obsidian-Config/.obsidian/community-plugins.json'); d=json.loads(p.read_text()); p.write_text(json.dumps([x for x in d if x != 'obsidian-git'], indent=2)+'\\n')"
          mkdir -p Obsidian-Config/05-Obsidian
          cp -a /tmp/obsidian-personal/05-Obsidian/Templates Obsidian-Config/05-Obsidian/
          cp -a /tmp/obsidian-personal/05-Obsidian/Snippets Obsidian-Config/05-Obsidian/

      - name: Commit imported configuration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A Obsidian-Config
          if git diff --cached --quiet; then
            echo 'No Obsidian changes to commit.'
          else
            git commit -m 'Import Obsidian configuration without Git plugin'
            git push
          fi
